<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusRunners - Home</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="phone-frame">
      <!-- Home screen -->
      <div class="screen active home-screen has-bottom-nav" id="screen-home">
        <div class="screen-scroll" id="customer-home-view">
          <button class="home-mode-switch" id="switch-to-runner" type="button">
            <span class="mode-switch-icon">🏃</span>
            <span>Switch to Runner</span>
            <span class="mode-switch-chevron">›</span>
          </button>
          <div class="home-greeting" id="home-greeting">
            Hi there! Need a hand with something?
          </div>

          <div class="home-cards">
            <button
              class="home-card card-blue"
              onclick="window.location.href = 'errands.html'"
            >
              <div class="home-card-icon">📦</div>
              <div class="home-card-text">
                <div class="home-card-title">Errands and delivery</div>
                <div class="home-card-desc">
                  Cafeteria runs, parcel pickup, printing, and laundry and more
                  in campus!
                </div>
              </div>
              <div class="home-card-chevron">&#8250;</div>
            </button>

            <button class="home-card card-yellow">
              <div class="home-card-icon">🧰</div>
              <div class="home-card-text">
                <div class="home-card-title">Services</div>
                <div class="home-card-desc">
                  Cleaning, tutoring, tech help, and more. Book a Runner by the
                  hour.
                </div>
              </div>
              <div class="home-card-chevron">&#8250;</div>
            </button>
          </div>

          <div class="home-info-wrapper">
            <button class="home-card card-info">
              <div class="home-card-icon">ℹ️</div>
              <div class="home-card-text">
                <div class="home-card-title">How CampusRunners works</div>
                <div class="home-card-desc">
                  Service hours, verified runners, Sabbath closure
                </div>
              </div>
              <div class="home-card-chevron">&#8250;</div>
            </button>
          </div>
        </div>

        <div class="screen-scroll runner-home-view" id="runner-home-view" hidden>
          <button class="home-mode-switch runner-mode-back" id="switch-to-customer" type="button">
            <span class="mode-switch-icon">←</span>
            <span>Switch to Customer</span>
            <span class="mode-switch-chevron">›</span>
          </button>
          <div class="home-greeting">Runner Home</div>
          <p class="runner-home-intro">Go online when you're ready to accept a campus errand.</p>

          <section class="runner-online-card" aria-label="Runner availability">
            <div class="runner-online-copy">
              <div class="runner-online-title" id="runner-online-title">You're offline</div>
              <div class="runner-online-hint" id="runner-online-hint">Go online to see available requests.</div>
            </div>
            <button class="runner-online-toggle" id="runner-online-toggle" type="button" aria-pressed="false">Go online</button>
          </section>

          <div id="runner-board" aria-live="polite"></div>
        </div>

        <!-- Floating order card: shows while an order is in progress -->
        <div class="order-float" id="order-float" hidden>
          <a class="order-float-main" id="order-float-main">
            <div class="order-float-dot" id="order-float-dot"></div>
            <div class="order-float-body">
              <div class="order-float-title" id="order-float-title"></div>
              <div class="order-float-sub" id="order-float-sub"></div>
            </div>
            <div class="order-float-chevron" id="order-float-chevron">
              &#8250;
            </div>
          </a>
          <div class="order-float-actions" id="order-float-actions"></div>
        </div>

        <div class="bottom-nav">
          <a class="nav-item current" href="home.html">
            <div class="nav-icon">
              <svg
                viewBox="0 0 24 24"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M3 11.5L12 4l9 7.5" />
                <path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9" />
              </svg>
            </div>
            <div class="nav-label">Home</div>
          </a>

          <a class="nav-item" href="activity.html">
            <div class="nav-icon">
              <svg
                viewBox="0 0 24 24"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M12 3a6 6 0 0 0-6 6c0 4-2 5-2 6h16c0-1-2-2-2-6a6 6 0 0 0-6-6z"
                />
                <path d="M10 20a2 2 0 0 0 4 0" />
              </svg>
            </div>
            <div class="nav-label">Activity</div>
          </a>

          <a class="nav-item nav-item-track" href="track.html">
            <div class="nav-icon">🏃</div>
            <div class="nav-label">Track</div>
          </a>

          <a class="nav-item" href="messages.html">
            <div class="nav-icon">
              <svg
                viewBox="0 0 24 24"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"
                />
              </svg>
            </div>
            <div class="nav-label">Messages</div>
          </a>

          <a class="nav-item" href="profile.html">
            <div class="nav-icon">
              <svg
                viewBox="0 0 24 24"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="8" r="4" />
                <path d="M4 21c0-4 4-7 8-7s8 3 8 7" />
              </svg>
            </div>
            <div class="nav-label">Profile</div>
          </a>
        </div>
      </div>
    </div>

    <script src="shared.js"></script>
    <script>
      // If the person just created an account, greet them by name.
      // If they arrived via login.html (no name captured) or directly,
      // fall back to the generic greeting already in the markup.
      var firstName = CampusRunnersSession.getFirstName();
      if (firstName) {
        document.getElementById("home-greeting").textContent =
          "Hi " + firstName + "! Need a hand with something?";
      }

      // ---- Floating order card ----
      var cancelArmed = false;
      var cancelTimer = null;
      var lastSignature = "";

      function makeButton(label, ghost, handler) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "order-float-btn" + (ghost ? " ghost" : "");
        b.textContent = label;
        b.addEventListener("click", handler);
        return b;
      }

      // Two taps to cancel so it can't happen by accident.
      function handleCancelTap() {
        if (!cancelArmed) {
          cancelArmed = true;
          clearTimeout(cancelTimer);
          cancelTimer = setTimeout(function () {
            cancelArmed = false;
            renderOrderCard(true);
          }, 3000);
          renderOrderCard(true);
          return;
        }
        clearTimeout(cancelTimer);
        cancelArmed = false;
        var result = CampusRunnersOrder.cancel();
        showToast(result.ok ? "Order cancelled." : result.message, {
          type: result.ok ? "default" : "error",
        });
      }

      function renderOrderCard(force) {
        var order = CampusRunnersOrder.get();
        var card = document.getElementById("order-float");
        var screen = document.getElementById("screen-home");

        if (!order) {
          card.hidden = true;
          screen.classList.remove("has-order-float");
          lastSignature = "";
          return;
        }

        var timedOut = CampusRunnersOrder.isSearchTimedOut(order);
        var signature = order.status + "|" + timedOut + "|" + cancelArmed;
        if (!force && signature === lastSignature) return;
        lastSignature = signature;

        var text = CampusRunnersOrder.cardText(order);
        var searching = order.status === "searching";

        document.getElementById("order-float-title").textContent = text.title;
        document.getElementById("order-float-sub").textContent = text.sub;
        document.getElementById("order-float-dot").className =
          "order-float-dot" + (searching && !timedOut ? " pulse" : "");

        // While searching there is nothing to open yet; after that it goes to Track.
        var main = document.getElementById("order-float-main");
        if (searching) {
          main.removeAttribute("href");
        } else {
          main.setAttribute("href", "track.html");
        }
        document.getElementById("order-float-chevron").hidden = searching;

        var actions = document.getElementById("order-float-actions");
        actions.innerHTML = "";
        if (searching) {
          if (timedOut) {
            actions.appendChild(
              makeButton("Keep waiting", false, function () {
                CampusRunnersOrder.keepSearching();
              }),
            );
          }
          actions.appendChild(
            makeButton(
              cancelArmed ? "Tap again to cancel" : "Cancel order",
              true,
              handleCancelTap,
            ),
          );
        }

        card.hidden = false;
        screen.classList.add("has-order-float");
      }

      CampusRunnersOrder.subscribe(function () {
        renderOrderCard(false);
      });
      setInterval(function () {
        renderOrderCard(false);
      }, 1000); // catches the search timeout
      renderOrderCard(true);

      // ---- Runner home and availability ----
      var runnerOnline = localStorage.getItem("cr_runner_online") === "1";
      var customerHome = document.getElementById("customer-home-view");
      var runnerHome = document.getElementById("runner-home-view");
      var phoneFrame = document.querySelector(".phone-frame");
      var bottomNav = document.querySelector(".bottom-nav");
      var runnerBoard = document.getElementById("runner-board");

      function runnerName() {
        var profile = CampusRunnersSession.getProfile();
        return profile.fullName || CampusRunnersSession.getFirstName() || "Campus Runner";
      }

      function setHomeMode(mode) {
        var isRunner = mode === "runner";
        customerHome.hidden = isRunner;
        runnerHome.hidden = !isRunner;
        bottomNav.hidden = false;
        phoneFrame.classList.toggle("runner-mode", isRunner);
        try { localStorage.setItem("cr_home_mode", isRunner ? "runner" : "customer"); } catch (e) {}
        window.dispatchEvent(new Event("cr:rolechange"));
        if (isRunner) renderRunnerHome();
      }

      function runnerNode(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      function runnerRow(card, label, value) {
        var row = runnerNode("div", "runner-detail-row");
        row.appendChild(runnerNode("span", "runner-detail-label", label));
        row.appendChild(runnerNode("span", "runner-detail-value", value || "—"));
        card.appendChild(row);
      }

      function runnerButton(container, label, handler, secondary) {
        var button = runnerNode("button", "runner-action-button" + (secondary ? " secondary" : ""), label);
        button.type = "button";
        button.addEventListener("click", function () {
          handler();
          renderRunnerHome();
        });
        container.appendChild(button);
      }

      function runnerMessageLink(container) {
        var link = runnerNode("a", "runner-message-link", "Open Messages");
        link.href = "messages.html";
        container.appendChild(link);
      }

      function renderRunnerHome() {
        if (!runnerHome || runnerHome.hidden) return;
        var title = document.getElementById("runner-online-title");
        var hint = document.getElementById("runner-online-hint");
        var toggle = document.getElementById("runner-online-toggle");
        title.textContent = runnerOnline ? "You're online" : "You're offline";
        hint.textContent = runnerOnline
          ? "You're ready to receive campus requests."
          : "Go online to see available requests.";
        toggle.textContent = runnerOnline ? "Go offline" : "Go online";
        toggle.classList.toggle("online", runnerOnline);
        toggle.setAttribute("aria-pressed", runnerOnline ? "true" : "false");
        runnerBoard.innerHTML = "";

        var order = CampusRunnersOrder.get();
        var mine = !!(order && order.runner && order.runner.name === runnerName());
        if (mine && order.status !== "searching") {
          renderRunnerTask(order);
          return;
        }
        if (!runnerOnline) {
          runnerBoard.appendChild(runnerNode("div", "runner-empty-card", "When you go online, available delivery and errand requests will appear here."));
          return;
        }
        var demoRequest = !order;
        if (order && (order.status !== "searching" || order.runner)) {
          runnerBoard.appendChild(runnerNode("div", "runner-empty-card", "A request is already being handled. New requests will appear here when it's complete."));
          return;
        }

        var post = runnerNode("section", "runner-post-card");
        post.appendChild(runnerNode("div", "runner-post-eyebrow", demoRequest ? "DEMO REQUEST · CAFETERIA" : "NEW REQUEST"));
        post.appendChild(runnerNode("div", "runner-post-title", demoRequest ? "Cafeteria run" : CampusRunnersOrder.place(order).label));
        runnerRow(post, "Pick-up", demoRequest ? "🍛 Cafeteria" : (order.pickup || (CampusRunnersOrder.isGate(order) ? "AUP Main Gate" : CampusRunnersOrder.isGazebo(order) ? "Gazebo" : CampusRunnersOrder.place(order).label)));
        runnerRow(post, "Drop-off", demoRequest ? "Library" : order.dropoff);
        runnerRow(post, "Budget", "₱" + (demoRequest ? 150 : (order.budget || 0)));
        runnerRow(post, "Delivery fee", "₱" + (demoRequest ? 30 : (order.deliveryFee || 0)));
        runnerRow(post, "Payment", demoRequest ? "Cash" : (order.paymentMethod === "online" ? "GCash / Online" : "Cash"));
        var instructions = runnerNode("div", "runner-instructions");
        instructions.appendChild(runnerNode("div", "runner-detail-label", "Detailed instructions"));
        instructions.appendChild(runnerNode("div", "runner-instructions-text", demoRequest
          ? "Please pick up 2 viands and 1 rice at the cafeteria, then bring the order to the Library. Confirm the items with the customer in Messages before shopping."
          : (order.message || "No instructions provided.")));
        post.appendChild(instructions);
        runnerButton(post, "Accept request", function () {
          if (demoRequest) {
            order = CampusRunnersOrder.create({
              type: "cafeteria",
              dropoff: "Library",
              budget: 150,
              deliveryFee: 30,
              paymentMethod: "cash",
              customerName: "Mia Santos",
              message: "Please pick up 2 viands and 1 rice at the cafeteria, then bring the order to the Library. Confirm the items with the customer in Messages before shopping."
            });
            if (!order) {
              showToast("Another request is already active.", { type: "error" });
              return;
            }
          }
          if (!CampusRunnersOrder.acceptRunner(runnerName())) {
            showToast("This request is no longer available.", { type: "error" });
          } else {
            showToast("Request accepted. Keep the customer updated in Messages.");
          }
        });
        runnerBoard.appendChild(post);
      }

      function renderRunnerTask(order) {
        var task = runnerNode("section", "runner-post-card runner-active-task");
        task.appendChild(runnerNode("div", "runner-post-eyebrow", "YOUR ACTIVE DELIVERY"));
        task.appendChild(runnerNode("div", "runner-post-title", CampusRunnersOrder.place(order).label));
        runnerRow(task, "Status", CampusRunnersOrder.STATUS_LABELS[order.status]);
        runnerRow(task, "Pick-up", order.pickup || (CampusRunnersOrder.isGate(order) ? "AUP Main Gate" : CampusRunnersOrder.isGazebo(order) ? "Gazebo" : CampusRunnersOrder.place(order).label));
        runnerRow(task, "Drop-off", order.dropoff);
        runnerRow(task, "Budget", "₱" + (order.budget || 0));
        runnerRow(task, "Delivery fee", "₱" + (order.deliveryFee || 0));
        runnerRow(task, "Payment", order.paymentMethod === "online" ? "GCash / Online" : "Cash");
        var instructions = runnerNode("div", "runner-instructions");
        instructions.appendChild(runnerNode("div", "runner-detail-label", "Detailed instructions"));
        instructions.appendChild(runnerNode("div", "runner-instructions-text", order.message || "No instructions provided."));
        task.appendChild(instructions);

        var actions = runnerNode("div", "runner-task-actions");
        var status = order.status;
        if (CampusRunnersOrder.isGate(order)) {
          if (status === "accepted") runnerButton(actions, order.expectedArrival === "now" ? "Food is at the Main Gate" : "Head to the AUP Main Gate", CampusRunnersOrder.advance);
          else if (status === "waiting_food") runnerButton(actions, "Food has arrived at the Main Gate", CampusRunnersOrder.advance);
          else if (status === "gate_pickup" && !order.pickupPhotos) runnerButton(actions, "Send pick-up proof", CampusRunnersOrder.sendGatePickupPhoto);
          else if (status === "gate_pickup") runnerButton(actions, "Head to drop-off", CampusRunnersOrder.advance);
          else if (status === "on_the_way") runnerButton(actions, "Arrived at drop-off", CampusRunnersOrder.advance);
        } else if (CampusRunnersOrder.isGazebo(order)) {
          if (status === "accepted") runnerButton(actions, "I'm at the Gazebo", CampusRunnersOrder.advance);
          else if (status === "picking_up" && !order.pickupPhotos) runnerButton(actions, "Send pick-up proof photos", CampusRunnersOrder.sendPickupPhotos);
          else if (status === "picking_up") runnerButton(actions, "Head to drop-off", CampusRunnersOrder.advance);
          else if (status === "on_the_way") runnerButton(actions, "Arrived at drop-off", CampusRunnersOrder.advance);
        } else if (status === "accepted") {
          runnerButton(actions, "I've arrived at pick-up", CampusRunnersOrder.advance);
        } else if (status === "choosing") {
          if (!order.photosSent) runnerButton(actions, "Share available items in Messages", CampusRunnersOrder.sendPhotos);
          else if (!order.confirmAsked) runnerButton(actions, "Ask customer to confirm items", CampusRunnersOrder.askConfirmation);
          else if (!order.itemsConfirmed) {
            actions.appendChild(runnerNode("div", "runner-waiting-note", "Waiting for the customer to confirm the items in Messages."));
            runnerMessageLink(actions);
          } else runnerButton(actions, "Start shopping", CampusRunnersOrder.advance);
        } else if (status === "buying") {
          if (order.overBudget && order.overBudget.status === "pending") {
            actions.appendChild(runnerNode("div", "runner-waiting-note", "Waiting for the customer's reply about the extra amount."));
            runnerMessageLink(actions);
          } else {
            if (!order.inQueue) runnerButton(actions, "Let customer know I'm in the queue", CampusRunnersOrder.notifyQueue, true);
            runnerButton(actions, "Request ₱20 more in Messages", function () { CampusRunnersOrder.requestOverBudget(20); }, true);
            runnerButton(actions, "Send receipt", CampusRunnersOrder.advance);
          }
        } else if (status === "receipt") {
          runnerButton(actions, "Head to drop-off", CampusRunnersOrder.advance);
        } else if (status === "on_the_way") {
          runnerButton(actions, "I've arrived", CampusRunnersOrder.advance);
        } else if (status === "arrived") {
          actions.appendChild(runnerNode("div", "runner-waiting-note", CampusRunnersOrder.isFrontDesk(order)
            ? "Confirm when payment is received to complete this delivery."
            : "Confirm payment here. The customer also needs to confirm they received the delivery."));
          runnerButton(actions, order.paymentMethod === "online" ? "Confirm payment received" : "Confirm cash received", function () { CampusRunnersOrder.confirm("runner"); });
          if (!CampusRunnersOrder.isFrontDesk(order)) runnerMessageLink(actions);
        }
        task.appendChild(actions);
        runnerBoard.appendChild(task);
      }

      document.getElementById("switch-to-runner").addEventListener("click", function () { setHomeMode("runner"); });
      document.getElementById("switch-to-customer").addEventListener("click", function () { setHomeMode("customer"); });
      document.getElementById("runner-online-toggle").addEventListener("click", function () {
        runnerOnline = !runnerOnline;
        localStorage.setItem("cr_runner_online", runnerOnline ? "1" : "0");
        renderRunnerHome();
      });
      CampusRunnersOrder.subscribe(renderRunnerHome);
      window.addEventListener("storage", function (event) {
        if (event.key === "cr_runner_online") {
          runnerOnline = event.newValue === "1";
          renderRunnerHome();
        }
      });
      try {
        if (localStorage.getItem("cr_home_mode") === "runner") setHomeMode("runner");
      } catch (e) {}

      CampusRunnersDemo.mount();
    </script>
  </body>
</html>
