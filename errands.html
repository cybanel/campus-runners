<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusRunners - Errands &amp; Delivery</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="phone-frame">
      <!-- Errands and delivery screen -->
      <div
        class="screen active signup-screen has-bottom-nav"
        id="screen-errands"
      >
        <div class="screen-scroll">
          <button class="back-btn" onclick="window.location.href = 'home.html'">
            &#8592;
          </button>

          <div class="signup-heading">Errands &amp; Delivery</div>
          <div class="signup-subtext">Choose an errand to get started</div>

          <div class="errand-grid">
            <a href="errands-cafeteria.html" class="errand-btn">
              <div class="errand-icon">🍛</div>
              <div class="errand-label">Cafeteria</div>
            </a>
            <button class="errand-btn">
              <div class="errand-icon">🛖</div>
              <div class="errand-label">Kubo</div>
            </button>
            <button class="errand-btn">
              <div class="errand-icon">🏪</div>
              <div class="errand-label">Store</div>
            </button>
            <button class="errand-btn">
              <div class="errand-icon">📦</div>
              <div class="errand-label">Parcel</div>
            </button>
            <button class="errand-btn">
              <div class="errand-icon">🍔</div>
              <div class="errand-label">Food</div>
            </button>
            <button class="errand-btn">
              <div class="errand-icon">🖨️</div>
              <div class="errand-label">Printing</div>
            </button>
          </div>

          <div class="anything-section">
            <div class="anything-heading">Need something else?</div>
            <div class="anything-desc">
              Custom pickup and drop-off, anywhere on campus. Tell us where to
              grab it and where it goes.
            </div>
            <button class="anything-btn">
              <div class="anything-icon">✨</div>
              <div class="anything-label">Anything</div>
            </button>
          </div>
        </div>

        <div class="bottom-nav">
          <a class="nav-item" href="home.html">
            <div class="nav-icon">
              <svg
                viewBox="0 0 24 24"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M3 11.5L12 4l9 7.5" />
                <path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9" />
              </svg>
            </div>
            <div class="nav-label">Home</div>
          </a>

          <div class="nav-item">
            <div class="nav-icon">
              <svg
                viewBox="0 0 24 24"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M12 3a6 6 0 0 0-6 6c0 4-2 5-2 6h16c0-1-2-2-2-6a6 6 0 0 0-6-6z"
                />
                <path d="M10 20a2 2 0 0 0 4 0" />
              </svg>
            </div>
            <div class="nav-label">Activity</div>
          </div>

          <div class="nav-item nav-item-track">
            <div class="nav-icon">🏃</div>
            <div class="nav-label">Track</div>
          </div>

          <div class="nav-item">
            <div class="nav-icon">
              <svg
                viewBox="0 0 24 24"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"
                />
              </svg>
            </div>
            <div class="nav-label">Messages</div>
          </div>

          <div class="nav-item">
            <div class="nav-icon">
              <svg
                viewBox="0 0 24 24"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="8" r="4" />
                <path d="M4 21c0-4 4-7 8-7s8 3 8 7" />
              </svg>
            </div>
            <div class="nav-label">Profile</div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
