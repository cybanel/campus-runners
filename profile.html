<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusRunners - Profile</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="phone-frame">
      <div class="screen active signup-screen has-bottom-nav" id="screen-profile">
        <div class="screen-scroll profile-scroll">
          <div class="request-heading">Profile</div>

          <section class="profile-card" aria-label="Account details">
            <div class="profile-photo-placeholder" aria-hidden="true">👤</div>
            <div class="profile-full-name" id="profile-full-name">Your name</div>
            <div class="profile-email" id="profile-email">Your AUP email</div>
          </section>

          <div class="request-section-label">Settings</div>
          <section class="profile-settings-card">
            <button class="profile-action" type="button" id="logout-button">
              <span>Log out</span><span aria-hidden="true">›</span>
            </button>
          </section>

          <div class="request-section-label">Account</div>
          <section class="profile-settings-card profile-danger-card">
            <div class="profile-danger-title">Delete account</div>
            <p class="profile-danger-copy">
              Remove your saved profile and local order history from this device.
            </p>
            <button class="profile-delete-button" type="button" id="delete-account-button">
              Delete account
            </button>
          </section>
        </div>

        <div class="bottom-nav">
          <a class="nav-item" href="home.html">
            <div class="nav-icon">
              <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 11.5L12 4l9 7.5" />
                <path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9" />
              </svg>
            </div>
            <div class="nav-label">Home</div>
          </a>
          <a class="nav-item" href="activity.html">
            <div class="nav-icon">
              <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3a6 6 0 0 0-6 6c0 4-2 5-2 6h16c0-1-2-2-2-6a6 6 0 0 0-6-6z" />
                <path d="M10 20a2 2 0 0 0 4 0" />
              </svg>
            </div>
            <div class="nav-label">Activity</div>
          </a>
          <a class="nav-item nav-item-track" href="track.html">
            <div class="nav-icon">🏃</div>
            <div class="nav-label">Track</div>
          </a>
          <a class="nav-item" href="messages.html">
            <div class="nav-icon">
              <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />
              </svg>
            </div>
            <div class="nav-label">Messages</div>
          </a>
          <a class="nav-item current" href="profile.html" aria-current="page">
            <div class="nav-icon">
              <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="8" r="4" />
                <path d="M4 21c0-4 4-7 8-7s8 3 8 7" />
              </svg>
            </div>
            <div class="nav-label">Profile</div>
          </a>
        </div>
      </div>
    </div>

    <script src="shared.js"></script>
    <script>
      var profile = CampusRunnersSession.getProfile();
      document.getElementById("profile-full-name").textContent =
        profile.fullName || "Name not set";
      document.getElementById("profile-email").textContent =
        profile.email || "AUP email not set";

      document.getElementById("logout-button").addEventListener("click", function () {
        CampusRunnersSession.logOut();
        window.location.href = "login.html";
      });

      document.getElementById("delete-account-button").addEventListener("click", function () {
        var confirmed = window.confirm(
          "Delete this account from this device? This also removes its saved orders and messages."
        );
        if (!confirmed) return;
        CampusRunnersSession.deleteAccount();
        CampusRunnersOrder.reset();
        window.location.href = "index.html";
      });
    </script>
  </body>
</html>
