<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusRunners - Log in</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="phone-frame">

    <!-- Log in screen -->
    <div class="screen active signup-screen" id="screen-login">

      <button class="back-btn" onclick="window.location.href='index.html'">&#8592;</button>

      <div class="signup-heading">Welcome back!</div>

      <div class="form-group" style="margin-top: 28px;">
        <label class="form-label" for="login-email">AUP email</label>
        <input class="form-input" type="email" id="login-email" placeholder="juan.delacruz@aup.edu.ph">
        <div class="form-error" id="login-email-error">Please enter a valid email address.</div>
      </div>

      <div class="form-group">
        <label class="form-label" for="login-password">Password</label>
        <input class="form-input" type="password" id="login-password" placeholder="Enter your password">
        <div class="form-error" id="login-password-error">Please enter your password.</div>
        <div class="forgot-password"><a href="#">Forgot password?</a></div>
      </div>

      <button class="create-account-btn" onclick="handleLogin()">Log in</button>
      <div class="signup-login-text">New to CampusRunners? <a class="login-link" href="createaccount.html">Create account</a></div>

    </div>

  </div>

  <script src="shared.js"></script>
  <script>
    function handleLogin() {
      var email = document.getElementById('login-email').value.trim().toLowerCase();
      var password = document.getElementById('login-password').value;

      var emailValid = isValidAupEmail(email);
      var passwordValid = password.length > 0;

      setFieldState('login-email', 'login-email-error', emailValid);
      setFieldState('login-password', 'login-password-error', passwordValid);

      if (emailValid && passwordValid) {
        localStorage.setItem('cr_email', email);
        window.location.href = 'home.html';
      }
    }

    attachLiveValidationClearing(['login-email', 'login-password']);
  </script>

</body>
</html>
